# Single source of truth for tunable pipeline behavior. Nothing tunable lives in Python (P5).
# See PROJECT_CONSTITUTION.md #16 for the full rationale behind each section.

tiers:
  ci:    { num_identities: 2400,    target_records: 5000,    backend: duckdb, dbt_target: dev }
  dev:   { num_identities: 24000,   target_records: 50000,   backend: duckdb, dbt_target: dev }
  scale: { num_identities: 2400000, target_records: 5000000, backend: spark,  dbt_target: prod }

# Sections below are declared now so the schema is stable across phases, but are only
# consumed starting at the phase noted in each comment.

blocking:  # Phase 5
  passes:
    - { name: bp_ssn,        keys: [ssn],        skip_if_null: true }
    - { name: bp_dob_lname,  keys: [dob, last_name_phonetic] }
    - { name: bp_year_names, keys: [dob_year, first_name_phonetic, last_name_phonetic] }
    - { name: bp_coarse,     keys: [last_name_phonetic, gender, dob_year] }  # was dob_decade, see design-decisions.md
  max_block_size: 1000

comparators:  # Phase 4
  name:
    near_threshold: 0.90
    similar_threshold: 0.80
    nickname_table: config/nicknames.yml

scoring:  # Phase 6
  method: fellegi_sunter
  params_file: config/fs_params.yml

# Empirically tuned via threshold_sweep (`python -m mdm.evaluate`), not by taste
# (PROJECT_CONSTITUTION.md #11.5). Measured at dev tier: this noise model separates true
# from non-matches cleanly enough within blocking's candidate-pair population that
# precision >= 0.99 and recall >= 0.99 are both satisfied from the same cutoff -- the
# review band collapses to zero-width here. See docs/design-decisions.md. Re-run the
# sweep and update these if fs_params.yml or the noise model changes.
#
# dev/ci tier ONLY -- mdm.pipeline.run_matching (local DuckDB) reads this directly via
# load_thresholds(). Does NOT transfer to the scale tier: the same FS score corresponds to
# a much lower precision at 5M records than at 50K (Phase 14 finding, see
# docs/design-decisions.md) -- the population of records that coincidentally agree on
# bp_coarse's key (last_name_phonetic + gender + dob_year) grows much faster than the
# population of true duplicates as record count grows, so a fixed score level gets
# reached by many more non-matches at scale. spark_jobs/cluster_identities.py's
# --upper-threshold is a separately-measured, scale-appropriate value (currently 20.5,
# see Makefile's dataproc-cluster-identities target and design-decisions.md) -- not this
# value. Re-derive both independently whenever fs_params.yml changes.
thresholds:  # Phase 6
  upper: 9.5203
  lower: 9.5203

clustering:  # Phase 7
  max_cluster_size: 6
  min_cluster_density: 0.6

survivorship:  # Phase 7
  rule_chain: [vendor_trust, plurality, completeness, recency, deterministic]
  vendor_trust:
    dob:        [VENDOR_A, VENDOR_C, VENDOR_B]
    first_name: [VENDOR_A, VENDOR_B, VENDOR_C]
    last_name:  [VENDOR_A, VENDOR_B, VENDOR_C]
    ssn:        [VENDOR_A, VENDOR_B]
    gender:     [VENDOR_A, VENDOR_B, VENDOR_C]

# GCP project/region/bucket are read from environment variables (GCP_PROJECT, GCP_REGION,
# GCS_BUCKET) and Terraform outputs (see Makefile), not from this file -- nothing in
# src/mdm reads a `gcp` key here, so a config block for it would be a second, unenforced
# source of truth (P5). The BigQuery query byte cap lives in dbt/profiles.yml's `prod`
# target (currently 50 GiB, see docs/design-decisions.md) since that's what dbt actually
# reads.
