# Single source of truth for tunable pipeline behavior. Nothing tunable lives in Python (P5).
# See PROJECT_CONSTITUTION.md #16 for the full rationale behind each section.

tiers:
  ci:    { num_identities: 2400,    target_records: 5000,    backend: duckdb, dbt_target: dev }
  dev:   { num_identities: 24000,   target_records: 50000,   backend: duckdb, dbt_target: dev }
  scale: { num_identities: 2400000, target_records: 5000000, backend: spark,  dbt_target: prod }

# Sections below are declared now so the schema is stable across phases, but are only
# consumed starting at the phase noted in each comment.

blocking:  # Phase 5
  passes:
    - { name: bp_ssn,        keys: [ssn],        skip_if_null: true }
    - { name: bp_dob_lname,  keys: [dob, last_name_phonetic] }
    - { name: bp_year_names, keys: [dob_year, first_name_phonetic, last_name_phonetic] }
    - { name: bp_coarse,     keys: [last_name_phonetic, gender, dob_year] }  # was dob_decade, see design-decisions.md
  max_block_size: 1000

comparators:  # Phase 4
  name:
    near_threshold: 0.90
    similar_threshold: 0.80
    nickname_table: config/nicknames.yml

scoring:  # Phase 6
  method: fellegi_sunter
  params_file: config/fs_params.yml

# Empirically tuned via threshold_sweep (`python -m mdm.evaluate`), not by taste
# (PROJECT_CONSTITUTION.md #11.5). Measured at dev tier: this noise model separates true
# from non-matches cleanly enough within blocking's candidate-pair population that
# precision >= 0.99 and recall >= 0.99 are both satisfied from the same cutoff -- the
# review band collapses to zero-width here. See docs/design-decisions.md. Re-run the
# sweep and update these if fs_params.yml or the noise model changes.
#
# Keyed by tier, because the threshold is a property of the population, not of the scorer:
# the same FS score corresponds to a much lower precision at 5M records than at 50K (Phase
# 14 finding) -- the population of records that coincidentally agree on bp_coarse's key
# (last_name_phonetic + gender + dob_year) grows much faster than the population of true
# duplicates as record count grows, so a fixed score level gets reached by many more
# non-matches at scale. Re-derive per tier whenever fs_params.yml or the noise model
# changes; load_thresholds(tier) raises on an unknown tier rather than defaulting, so a
# missing entry fails loudly instead of silently borrowing another tier's cutoff.
thresholds:  # Phase 6
  ci:
    # Deliberately dev's measured values, NOT a ci-specific sweep. ci is a 5,050-record
    # smoke tier, not a measurement tier: `python -m mdm.evaluate --tier ci` does produce
    # its own cutoff (1.7929), but that only satisfies threshold_sweep's 0.99 precision
    # target on *core* member matching, and the same threshold is reused for match-path
    # resolution against a different candidate population. At 1.7929 two distinct people
    # merged into one patient_global_id -- caught by test_member_360_domain_counts_match_
    # fact_tables, which reconciles member_360's plan-tier count against fct_pharmacy_info
    # (a member-level file: one record per person, so a collision there is a false merge).
    # A false merge is a safety incident; a low recall figure on a smoke tier is not.
    upper: 9.5203
    lower: 9.5203
  dev:
    upper: 9.5203   # measured, dev tier (50,482 records)
    lower: 9.5203
  scale:
    upper: 20.5     # measured, scale tier (5,048,389 records) -- docs/scale-run.md
    # NOT independently measured. Held equal to `upper` deliberately: while this file
    # carried one global pair, the scale tier auto-matched at 20.5 (passed to
    # spark_jobs/cluster_identities.py) but built its review queue from the dev band
    # [9.5203, 9.5203) -- so every pair scoring 9.5203-20.5 was neither auto-matched nor
    # routed to review, and was silently dropped as a non-match. A zero-width band drops
    # nothing silently, which is the honest state until a real scale-tier `lower` is
    # derived from a threshold_sweep against the 5M ground truth.
    lower: 20.5

clustering:  # Phase 7
  max_cluster_size: 6
  min_cluster_density: 0.6

survivorship:  # Phase 7
  rule_chain: [vendor_trust, plurality, completeness, recency, deterministic]
  vendor_trust:
    dob:        [VENDOR_A, VENDOR_C, VENDOR_B]
    first_name: [VENDOR_A, VENDOR_B, VENDOR_C]
    last_name:  [VENDOR_A, VENDOR_B, VENDOR_C]
    ssn:        [VENDOR_A, VENDOR_B]
    gender:     [VENDOR_A, VENDOR_B, VENDOR_C]

# GCP project/region/bucket are read from environment variables (GCP_PROJECT, GCP_REGION,
# GCS_BUCKET) and Terraform outputs (see Makefile), not from this file -- nothing in
# src/mdm reads a `gcp` key here, so a config block for it would be a second, unenforced
# source of truth (P5). The BigQuery query byte cap lives in dbt/profiles.yml's `prod`
# target (currently 50 GiB, see docs/design-decisions.md) since that's what dbt actually
# reads.
