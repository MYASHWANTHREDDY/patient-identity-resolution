version: 2

models:
  - name: dim_member
    description: "Serving view over the golden record + membership size."
    columns:
      - name: patient_global_id
        tests:
          - unique
          - not_null

  - name: member_360
    description: "Golden record + every alternate identifier + a field_lineage row count."
    columns:
      - name: patient_global_id
        tests:
          - unique
          - not_null

  - name: agg_dedup_metrics
    description: "Dashboard-facing aggregates (Phase 9 Overview tab): one row per build."

  - name: fct_medical_history
    description: >
      Phase 19 join-path fact table (Path A). One row per encounter -- never deduplicated,
      never survived. patient_global_id is guaranteed non-null by construction (an inner
      join through member_alternate_identifier), but tested explicitly anyway rather than
      trusted implicitly (docs/domain-linking-strategy.md).
    columns:
      - name: patient_global_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('serving_written', 'membership')
                field: patient_global_id
      - name: encounter_key
        tests:
          - unique
          - not_null

  - name: fct_medical_claims
    description: "Phase 19 join-path fact table (Path A). One row per claim."
    columns:
      - name: patient_global_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('serving_written', 'membership')
                field: patient_global_id
      - name: claim_key
        tests:
          - unique
          - not_null

  - name: fct_pharmacy_claims
    description: >
      Phase 19 join-path fact table (Path B -- two joins, through vendor_id_map_normalized
      then the crosswalk, not a direct one like the two fact tables above).
    columns:
      - name: patient_global_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('serving_written', 'membership')
                field: patient_global_id
      - name: rx_key
        tests:
          - unique
          - not_null

  - name: fct_pharmacy_info
    description: >
      Phase 20 match-path fact table. One row per pharmacy_info record that real matching
      (scripts/run_matchpath_matching.py) auto-matched to a patient_global_id -- unlike
      fct_medical_history/fct_medical_claims/fct_pharmacy_claims, not every conformance row
      is guaranteed to appear here (docs/domain-linking-strategy.md).
    columns:
      - name: patient_global_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('serving_written', 'membership')
                field: patient_global_id
      - name: source_record_id
        tests:
          - unique
          - not_null

  - name: fct_lab_results
    description: >
      Phase 20 match-path fact table. One row per test result whose parent lab_identity
      record auto-matched to a patient_global_id.
    columns:
      - name: patient_global_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('serving_written', 'membership')
                field: patient_global_id
      - name: lab_result_key
        tests:
          - unique
          - not_null
