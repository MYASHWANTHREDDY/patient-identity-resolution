version: 2

sources:
  - name: raw_standard
    description: >
      Layer 1. Vendor data as received, loaded with no transform (a free BigQuery load job,
      or DuckDB read_parquet locally -- see mdm.backends.local). Dates are STRING, in each
      vendor's own format.
    schema: raw_standard
    tables:
      - name: vendor_a
      - name: vendor_b
      - name: vendor_c
      # Phase 19 fact domains (docs/domain-linking-strategy.md's join-path cells): one raw
      # table per (vendor, domain), field-naming consistent across vendors within a domain
      # (unlike vendor_a/b/c above -- see src/mdm/generator/facts.py's module docstring for
      # why that deliberate variance doesn't apply here), plus the Path B id map.
      - name: vendor_a_medical_history
      - name: vendor_a_medical_claims
      - name: vendor_a_pharmacy_claims
      - name: vendor_b_medical_claims
      - name: vendor_c_medical_history
      - name: vendor_c_pharmacy_claims
      - name: vendor_id_map
      # Phase 20 match-path domains (docs/domain-linking-strategy.md's match-path cells):
      # exactly one source vendor each, so no vendor prefix in the table name (unlike the
      # Phase 19 fact domains above).
      - name: pharmacy_info
      - name: lab_identity
      - name: lab_results
