version: 2

models:
  - name: patient_normalized
    description: >
      Layer 2 conformance: one unified row per source record. Dates parsed, gender
      standardized, names cleaned, phonetic keys precomputed. No de-duplication yet --
      source_vendor + source_record_id keep lineage back to Layer 1.
    columns:
      - name: record_key
        description: "{vendor}:{record_id} -- the global record identifier."
        tests:
          - unique
          - not_null
      - name: source_vendor
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["VENDOR_A", "VENDOR_B", "VENDOR_C"]
      - name: source_record_id
        tests:
          - not_null
      - name: first_name
        tests:
          - not_null
      - name: last_name
        tests:
          - not_null
      - name: dob
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ["M", "F", "U"]

  - name: medical_history_normalized
    description: >
      Layer 2, fact grain (Phase 19, Path A). One row per encounter, never deduplicated --
      not a golden record, so no unique test on anything but the compound key.
    columns:
      - name: encounter_key
        tests:
          - unique
          - not_null
      - name: member_id
        tests:
          - not_null

  - name: medical_claims_normalized
    description: "Layer 2, fact grain (Phase 19, Path A). One row per claim."
    columns:
      - name: claim_key
        tests:
          - unique
          - not_null
      - name: member_id
        tests:
          - not_null
      - name: claim_status
        tests:
          - accepted_values:
              arguments:
                values: ["paid", "denied", "pending"]

  - name: pharmacy_claims_normalized
    description: >
      Layer 2, fact grain (Phase 19, Path B). pbm_member_id is deliberately *not* resolved
      to patient_global_id here -- that's fct_pharmacy_claims.sql's job, via
      vendor_id_map_normalized.
    columns:
      - name: rx_key
        tests:
          - unique
          - not_null
      - name: pbm_member_id
        tests:
          - not_null

  - name: vendor_id_map_normalized
    description: "Layer 2 pass-through for Path B's per-vendor pbm_member_id -> enrollment_member_id map."
    columns:
      - name: pbm_member_id
        tests:
          - unique
          - not_null

  - name: pharmacy_info_normalized
    description: >
      Layer 2, match-path (Phase 20). Shaped like patient_normalized -- ssn is a typed
      NULL, never populated for this domain -- so scripts/run_matchpath_matching.py can
      block/score it against patient_normalized with the unchanged pipeline.
    columns:
      - name: record_key
        tests:
          - unique
          - not_null
      - name: source_record_id
        tests:
          - not_null
      - name: first_name
        tests:
          - not_null
      - name: last_name
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ["M", "F", "U"]

  - name: lab_identity_normalized
    description: >
      Layer 2, match-path (Phase 20). VENDOR_D, no eligibility relationship to key off of
      at all -- shaped like pharmacy_info_normalized for the same reason.
    columns:
      - name: record_key
        tests:
          - unique
          - not_null
      - name: source_record_id
        tests:
          - not_null
      - name: first_name
        tests:
          - not_null
      - name: last_name
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ["M", "F", "U"]

  - name: patient_normalized_with_matchpath
    description: >
      Scale-tier match-path scoring (Phase 20): patient_normalized plus the two match-path
      domains, minimal columns (record_key + the five comparator fields) -- lets
      spark_jobs/score_pairs.py score matchpath_candidate_pairs unmodified.
    columns:
      - name: record_key
        tests:
          - unique
          - not_null

  - name: lab_results_normalized
    description: >
      Layer 2, fact grain (Phase 20). One row per test result, never deduplicated --
      lab_result_key is a row_number surrogate, not a stable cross-run identifier.
    columns:
      - name: lab_result_key
        tests:
          - unique
          - not_null
      - name: source_record_id
        tests:
          - not_null
      - name: abnormal_flag
        tests:
          - accepted_values:
              arguments:
                values: ["normal", "high", "low", "critical"]
